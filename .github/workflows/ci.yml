# The gate, run exactly the way it runs locally: `nix develop` supplies the
# toolchain pinned in flake.lock, and `hk check` runs the ops defined in
# hk.pkl. One definition, one toolchain, no second install path, and no
# version skew between a runner and a laptop.
#
# hk stays a LOCAL tool: CI reaches it *through* the dev shell rather than
# installing it, so it never becomes a dependency of the crate. Same for
# every linter -- typos, taplo and nixfmt all arrive from the same pinned
# shell, which is why this file installs none of them.
#
# PENDING -- listed rather than silently absent, because a gap you can read
# is not the same failure as a gap you cannot:
#   * build caching (nix store + cargo target)
#   * release automation and publish            -- T8
#
# The matrix covers every system flake.nix declares, one runner each, so
# `nix build .#default` proves each of them rather than one standing in
# for the rest.
#
# NOT copied from the consumer's workflow, deliberately: `fetch-depth: 0`.
# That exists there because its tests read `HEAD~n`; nothing here does, so
# a full-history clone would be cost with no purpose.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The token this workflow gets is the one it can leak. Nothing here writes to
# the repository -- no tag, no comment, no commit -- so read is the whole
# requirement, and stating it means a future step that needs more has to ask
# for it in the diff rather than inherit it from a repository setting that
# appears in no file at all. `zizmor` gates this: with no block, it reports
# whatever the default happens to be today, and that default is a scope
# chosen in a settings page and readable nowhere else.
permissions:
  contents: read

# A second push to the same branch makes the first run's verdict worthless --
# it reports on a tree nobody will merge, while holding runners the new one
# needs. Keyed on the ref, so `main` and each pull request cancel only their
# own earlier runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, so one failure does not hide another that
      # is specific to the other OS -- the same argument as --no-fail-fast
      # one level up.
      fail-fast: false
      # One runner per system flake.nix declares, so the platform claim in
      # the README is gated rather than asserted:
      #   ubuntu-latest    x86_64-linux
      #   ubuntu-24.04-arm aarch64-linux
      #   macos-latest     aarch64-darwin
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      # Pinned to commit SHAs, not tags. A tag is mutable: whoever controls
      # the action can move `v4` to different code, and every workflow that
      # trusts the tag runs it on the next push. The tag stays in the
      # comment because a SHA alone tells a reader nothing about what
      # version they are on, or whether it is behind.
      #
      # persist-credentials: false -- checkout writes the job token into
      # `.git/config` as an extraheader by default, where every later step
      # in the job can read it. Nothing here pushes, and the only thing this
      # workflow wants from git is the tree, which is on disk once the fetch
      # completes. After that the credential is liability with no use.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      # --check, because `hk check` defaults to running FIX commands; CI
      # must report, never rewrite. --all, because CI has no staged set.
      #
      # --no-fail-fast inverts the local default on purpose: locally the
      # loop is cheap so the FIRST failure is most useful, while here a
      # round-trip costs minutes, so whoever -- or whatever -- fixes this
      # should get every problem in one pass.
      - run: nix develop --command hk check --all --check --no-fail-fast

      # The package must build reproducibly from the tracked lock alone.
      - run: nix build .#default
