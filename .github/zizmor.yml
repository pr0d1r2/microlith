# zizmor's ignore ledger -- the DEBT, written down rather than absorbed.
#
# The gate runs `--persona=pedantic`, which is stricter than the findings this
# repository is obliged to fix: pedantic reports code smells, and a smell is a
# claim about how a file will age rather than about how it behaves today.
# Running it anyway is the point. Conforming to the stricter reading is what
# produces the more pristine file, and the entry below is the price of NOT
# conforming, stated once and in the open.
#
# WHAT AN ENTRY MEANS: this finding is real, it is understood, and it is not
# being fixed for a reason that outlives whoever wrote it down. What it does
# NOT mean is that the finding is wrong. A false positive belongs upstream as
# a bug report, not here.
#
# EVERY ENTRY CARRIES ITS EXIT. An ignore with no stated condition for its own
# removal is indistinguishable from one nobody ever revisits, which is how a
# debt register becomes a wall of noise -- V17 pointing the other way: a rule
# with no runner is a sentence, and an exemption with no exit is the same
# thing seen from the other side.
#
# LINE NUMBERS ARE PART OF THE MATCH, so an entry that drifts stops
# suppressing and the finding returns. That is a feature -- it forces a
# re-read whenever the surrounding job moves -- but it means editing `ci.yml`
# above the job can turn the gate red without anything being wrong. When that
# happens the fix is to update the number here after confirming the reason
# still holds, never a broader pattern.

rules:
  # DEBT, opened 2026-09-09. The `gate` job is deliberately anonymous.
  #
  # `main`'s branch protection requires THREE status checks, and their names
  # are generated by GitHub from the job id and the matrix values:
  #
  #   gate (ubuntu-latest) · gate (ubuntu-24.04-arm) · gate (macos-latest)
  #
  # A `name:` on the job renames every one of them. The three required checks
  # then wait for names that will never be reported again, and no pull request
  # can merge until someone edits branch protection by hand -- an out-of-band
  # change, in a settings page, that no diff records and no gate here can see.
  # That is a strictly worse failure than the smell: the smell costs a reader
  # one lookup, and the fix costs the repository its merge path.
  #
  # EXIT: pay this off in ONE commit that adds the name AND updates the
  # required-check list, in that order, on a branch whose own run has already
  # reported the new contexts. Verify with
  # `gh api repos/pr0d1r2/microlith/branches/main/protection`. Until someone
  # is doing exactly that, the name stays off.
  anonymous-definition:
    ignore:
      - ci.yml:51
