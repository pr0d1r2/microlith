# Self-specified, not workspace-inherited: microlith is born standalone, so
# it carries its own package metadata and lints from commit one (V20 --
# a consumer depends on a registry crate, never a path that dangles).
[package]
# The CRATE carries the meaning, the BINARY carries the muscle memory --
# `ripgrep`/`rg` and `bottom`/`btm`, the established Rust CLI shape. A
# `-cli` suffix is what `du-dust` and `fd-find` wear because their short
# name was TAKEN; `microlith` is free, so there is nothing to work around,
# and `use microlith::check_spec` stays the legible half of V32's three
# contracts. See §C for why the split exists at all.
name = "microlith"
# A minor is a level of GUARANTEE, not a feature count (V30). The full
# ladder lives in SPEC.md and is rendered for consumers in CHANGELOG.md.
#
# WHAT THIS COMMENT NO LONGER DOES: restate which rung the number below is
# on. It did, and it drifted -- it narrated 0.4.0 through the whole of
# 0.5.0, so a reader met a manifest whose prose and whose number disagreed
# about what had been paid for. A second copy of a fact that already has a
# home is the defect this crate exists to end (V7), and the fix is to
# delete the copy rather than to remember to update it.
#
# The number is a MEASUREMENT: each rung answers "what can you rely on at
# this tag?", and it moves when a milestone's done-when is met -- never to
# mark effort. Read CHANGELOG.md's table for which rung this is.
#
# A PATCH sits OFF that ladder, which is why the ladder has no row for one:
# a rung is a MINOR, and a patch is what happens when the answer to "what
# can you rely on" does not change. It carries fixes and metadata only --
# never a new guarantee, because a new guarantee is a rung by definition.
version = "0.6.1"
edition = "2024"
# The floor is the PINNED toolchain, and the pin is now the fleet's one
# nixpkgs authority (nixos-26.05) rather than a rev copied between repos --
# so this moved DOWN, 1.96 -> 1.95, and lowering it is the cheaper
# direction: it widens who can build this crate. Nothing in `src/` asks for
# 1.96; the highest feature actually used is `Option::is_none_or` (1.82).
# 1.96 was a MEASUREMENT of whatever the old rev happened to carry, which
# is exactly how a floor drifts upward without anyone deciding.
rust-version = "1.95"
license = "MIT"
description = "mechanical operations on caveman SPEC.md: lossless minify, structural check, derived reports. CPU only, zero deps"
readme = "README.md"
# `cargo package` warns without one of these, and the warning is right: the
# crates.io page and docs.rs both link back through it, so a crate without
# it is one a reader cannot get from the listing to the source. Declared
# ahead of the repo being public -- flake.nix already names the same URL,
# and two places claiming different homes would be worse than one claiming
# a home that is not published yet.
repository = "https://github.com/pr0d1r2/microlith"
# Five is the crates.io maximum. `cli` went because `categories`
# already says command-line-utilities; `cavekit` earns its place as the
# search term someone in that ecosystem would actually type.
keywords = ["spec", "cavekit", "markdown", "formatter", "agents"]
categories = ["command-line-utilities", "development-tools"]
# What NOT to ship: the dev environment and CI machinery, which only mean
# anything inside the git repo. A `.crate` is source a consumer builds, not
# a clone of how it is developed.
#
# What deliberately STAYS is NOT listed here -- it is `must-package` below,
# where a gate step can read it. This list and that one are the two halves of
# one decision, and only one of them can be checked.
exclude = [
  ".envrc",
  ".github/",
  ".gitignore",
  "flake.nix",
  "flake.lock",
  "hk.pkl",
  "pkl/",
  # The RECORD of what ships, and the config that publishes it. Both are about
  # the release rather than part of it, and `.crate-files` excluded means the
  # list never has to contain its own name.
  ".crate-files",
  "release.toml",
  # FORMAT.md ships (must-package names it); the record of which upstream
  # version it matches is about tracking the file, not part of it.
  ".format-upstream",
]

# What a `.crate` MUST carry, checked rather than described. Cargo ignores
# `package.metadata`, so this is a declaration for our own gate: the
# `package` step asserts every path here appears in `cargo package --list`.
#
# It exists because publishing does not ship the REPO, it ships a tarball
# whose file set is DERIVED -- git-tracked, minus `exclude`. That is a second
# file set nothing else in this repo examines, and these paths are exactly
# the ones that look like dev clutter while the test suite depends on them.
#
# MEASURED: unpack the real tarball and `cargo test` passes, 184 of 184.
# Delete `.spec-records` from it and `cli::tests::check_says_what_it_examined`
# panics at src/cli.rs:642 -- while the repo's own suite stays GREEN, because
# the repo still has the file. Nobody would find that before a consumer did.
#
#   FORMAT.md       cavekit's format, VENDORED VERBATIM. §V is what this
#                   tool enforces; this ships so a reader can see the format
#                   the rules are written against
#   SPEC.md         `tests/dogfood.rs` reads it; without it `cargo test` on
#   .spec-records   the unpacked crate fails rather than dogfooding
#   .context-limits the ceiling and the reasoning behind eleven raises
#   clippy.toml     the code limits this source was written against, so it
#   rustfmt.toml    lints and formats identically once unpacked
[package.metadata.microlith]
must-package = [
  "FORMAT.md",
  "SPEC.md",
  ".spec-records",
  ".context-limits",
  "clippy.toml",
  "rustfmt.toml",
]

[[bin]]
name = "mth"
path = "src/main.rs"

# Zero dependencies. Every operation here is CPU-derivable (V6), so a dep
# would buy nothing and cost every consumer a transitive edge.
[dependencies]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"

[lints.rust]
unsafe_code = "forbid"
